name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm 11's arborist crashes on this tree during ideal-tree build
      # (`Invalid Version: ` via semver compare on empty versions — same crash
      # reproduces locally on npm 11/Node 24). npm 10 resolves it fine.
      - run: npm install -g npm@10 --no-audit --no-fund
      # No lockfile-agnostic install: works with or without package-lock.json.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          # Build must succeed without secrets (DB/key checks are lazy).
          MONGODB_URI: mongodb://localhost:27017/vocabs-ci
          JWT_SECRET: ci-placeholder-secret-min-16-chars
