<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voilà Vocabs — Light up Paris 🗼</title>
<style>
:root{
  color-scheme:dark;
  --bg:#05070C; --card:rgba(245,241,232,.05); --ink:#F5F1E8; --muted:#9AA3B2;
  --frame:rgba(245,241,232,.13); --accent:#5B8CFF; --sun:#FFC98A; --gold:#FFD833;
  --leaf:#2FE09A; --danger:#FF7A92; --nav-bg:rgba(5,7,12,.9);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{position:sticky;top:0;z-index:10;background:var(--nav-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--frame)}
.hwrap{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:28px}
h1{font-size:18px;font-weight:800}
h1 span{color:var(--sun)}
.rank{font-size:12px;color:var(--muted)}
.hstats{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--frame);border-radius:30px;padding:5px 12px;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer}
.pill.on{border-color:var(--accent);color:#fff}
select.pill{appearance:none}
.ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;
  background:conic-gradient(var(--sun) var(--p,0%),#1a2030 var(--p,0%));border:1px solid var(--frame)}
.ring b{background:#0b0e15;border-radius:50%;width:30px;height:30px;display:grid;place-items:center}
nav{max-width:760px;margin:0 auto;padding:10px 12px 0;display:flex;gap:6px;overflow-x:auto}
.tab{flex:1;min-width:80px;padding:10px 4px;border-radius:14px 14px 0 0;border:1px solid var(--frame);border-bottom:none;
  background:transparent;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--card);color:var(--ink);box-shadow:inset 0 3px 0 var(--sun)}
.tab .bdg{background:var(--danger);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;margin-left:3px}
main{max-width:760px;margin:0 auto;padding:12px;min-height:70vh}
.panel{display:none;background:var(--card);border:1px solid var(--frame);border-radius:0 var(--r-lg) var(--r-lg) var(--r-lg);padding:16px}
.panel.on{display:block}
.center{max-width:560px;margin:0 auto}
/* ---------- NIGHT JOURNEY ---------- */
.night{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--frame);
  background:linear-gradient(180deg,#02040a 0%,#0a1030 45%,#1b1440 70%,#3a1c50 100%);padding:18px 14px 8px;text-align:center}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 2.8s infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.moon{position:absolute;top:16px;right:22px;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffbe8,#f5e9c8 60%,#d9c795);box-shadow:0 0 30px 8px rgba(255,251,232,.35)}
.city-glow{font-size:24px;font-weight:900;text-shadow:0 0 24px rgba(255,216,51,.5);margin-top:26px}
.city-sub{color:#cdd6f4;font-size:13px;margin-top:4px}
.time-chip{display:inline-block;background:rgba(0,0,0,.4);border:1px solid var(--frame);border-radius:20px;
  padding:4px 12px;font-size:12px;color:var(--sun);margin-top:8px}
.eiffel{width:150px;margin:6px auto 0;display:block;transition:filter 1s}
.paris-meter{margin:10px auto 4px;max-width:420px}
.paris-meter .bar{height:12px;background:rgba(0,0,0,.5);border:1px solid var(--frame);border-radius:10px;overflow:hidden}
.paris-meter .bar i{display:block;height:100%;background:linear-gradient(90deg,#5B8CFF,var(--gold));width:0%;transition:width .8s}
.paris-meter small{color:#cdd6f4;font-size:12px}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 2px}
.bdg{width:52px;text-align:center;font-size:24px;filter:grayscale(1);opacity:.35}
.bdg.got{filter:none;opacity:1}
.bdg small{display:block;font-size:9px;color:var(--muted)}
.bdg.got small{color:var(--gold)}
.path{position:relative;margin-top:6px}
.road{position:absolute;inset:0;width:100%;height:100%}
.road path{fill:none;stroke:rgba(255,201,138,.4);stroke-width:2;stroke-dasharray:6 6}
.pnode{display:flex;align-items:center;gap:12px;min-height:104px}
.pnode.r{flex-direction:row-reverse;text-align:right}
.pnode-circ{flex:none;width:110px;display:flex;justify-content:center;position:relative}
.pcirc{width:72px;height:72px;border-radius:50%;border:3px solid var(--frame);background:#101528;color:var(--ink);
  font-size:30px;cursor:pointer;position:relative}
.pcirc.cur{border-color:var(--gold);box-shadow:0 0 22px 4px rgba(255,216,51,.55);animation:pulse 1.8s infinite}
.pcirc.done{border-color:var(--leaf);box-shadow:0 0 16px 2px rgba(47,224,154,.5)}
.pcirc.boss{border-color:var(--danger)}
.pcirc.locked{opacity:.45;cursor:not-allowed}
.pcirc .mini{position:absolute;bottom:-6px;right:-6px;font-size:18px;background:#0b0e15;border-radius:50%;padding:1px}
.speech-bubble{position:absolute;top:-24px;background:var(--gold);color:#3a2500;font-size:11px;font-weight:800;
  border-radius:12px;padding:2px 10px;white-space:nowrap}
.ptitle{flex:1;background:transparent;border:none;color:var(--ink);cursor:pointer;text-align:left}
.pnode.r .ptitle{text-align:right}
.ptitle b{font-size:16px;display:block}
.ptitle .sm{font-size:12px}
.ptitle:disabled{cursor:not-allowed}
.d-head{text-align:center}
.d-head .big{font-size:54px}
.d-head h2{margin:4px 0}
/* ---------- Voilà learning UI ---------- */
.card{background:rgba(245,241,232,.07);border:1px solid var(--frame);border-radius:var(--r-lg);padding:22px 16px;margin:12px 0;text-align:center;cursor:default}
.card.tap{cursor:pointer}
.sm{font-size:13px;color:var(--muted)}
.fr{font-size:32px;font-weight:700;margin-top:8px;line-height:1.25}
.opt{display:block;width:100%;text-align:left;background:rgba(245,241,232,.05);border:1px solid var(--frame);color:var(--ink);
  border-radius:var(--r-md);padding:13px 14px;font-size:16px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt:disabled{cursor:default;opacity:.85}
.opt.ok{border-color:var(--leaf);background:rgba(47,224,154,.12)}
.opt.no{border-color:var(--danger);background:rgba(255,122,146,.12)}
.opt .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.cta{display:block;width:100%;border:none;border-radius:var(--r-md);padding:14px;font-size:17px;font-weight:800;cursor:pointer;
  background:var(--accent);color:#fff;margin:12px 0 4px}
.cta.ghost{background:transparent;border:1px solid var(--frame);color:var(--ink);font-weight:600;font-size:15px}
.cta.sun{background:var(--sun);color:#3a2500}
.cta.gold{background:var(--gold);color:#3a2500}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.fb{background:rgba(245,241,232,.06);border:1px solid var(--frame);border-radius:var(--r-md);padding:12px 14px;margin:10px 0;font-size:15px}
.fbline{font-weight:700;margin-top:8px}
.combo{color:#ff9d3c;font-weight:900;animation:pop .3s ease}
.row{display:flex;align-items:center;gap:10px}
.circ{width:40px;height:40px;border-radius:50%;border:1px solid var(--frame);background:transparent;color:var(--ink);font-size:18px;cursor:pointer;flex:none}
input[type=text]{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--frame);border-radius:var(--r-md);
  color:var(--ink);font-size:19px;padding:13px;text-align:center;margin-top:10px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.accents{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.accents button{background:rgba(245,241,232,.07);border:1px solid var(--frame);color:var(--ink);border-radius:10px;
  min-width:38px;padding:8px;font-size:16px;cursor:pointer}
.accents button:hover{border-color:var(--sun)}
.score{display:flex;gap:10px;margin:12px 0}
.score div{flex:1;background:rgba(245,241,232,.06);border:1px solid var(--frame);border-radius:var(--r-md);padding:10px;text-align:center}
.score b{display:block;font-size:22px}.score span{font-size:12px;color:var(--muted)}
.hero{font-size:48px;margin:4px 0;text-align:center}
.hero-title{font-size:22px;font-weight:800;text-align:center}
.hero-sub{color:var(--muted);font-size:14px;margin:8px 0 4px;text-align:center;line-height:1.55}
.seg{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.seg button{flex:1;min-width:70px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar input{flex:2;min-width:140px;margin-top:0;text-align:left;font-size:15px}
.toolbar select{flex:1;min-width:100px;background:#0b0e15;border:1px solid var(--frame);color:var(--ink);border-radius:var(--r-sm);padding:10px}
.count{color:var(--muted);font-size:13px;margin-bottom:8px}
h2{font-size:18px;margin:16px 0 4px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
.kbd-hint{color:var(--muted);font-size:12px;margin-top:8px;text-align:center}
.pop{animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* toast + confetti */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#141a2e;border:2px solid var(--gold);
  color:var(--ink);border-radius:14px;padding:10px 18px;font-weight:800;font-size:15px;z-index:99;animation:pop .25s ease;
  box-shadow:0 8px 30px rgba(0,0,0,.6);max-width:90vw;text-align:center}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:98;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:560px){.fr{font-size:26px}h1{font-size:16px}.eiffel{width:120px}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">🗼</div>
    <div><h1>Voilà <span>Vocabs</span> · Paris la Nuit</h1><div class="rank" id="rank">…</div></div>
    <div class="hstats">
      <select class="pill" id="course" title="Studying level">
        <option value="">🌍 All</option><option value="A1">A1</option><option value="A2">A2</option><option value="B1">B1</option>
      </select>
      <div class="pill">⚡ <span id="hXp">0</span></div>
      <div class="pill">🔥 <span id="hStreak">0</span></div>
      <div class="ring" id="hRing" title="Daily goal: 100 XP"><b id="hRingTx">0%</b></div>
    </div>
  </div>
</header>
<nav>
  <button class="tab on" data-tab="journey">🗼 Journey</button>
  <button class="tab" data-tab="learn">🌱 Learn</button>
  <button class="tab" data-tab="practice">🏋️ Practice</button>
  <button class="tab" data-tab="review">💧 Review</button>
  <button class="tab" data-tab="speed">⚡ Speed</button>
  <button class="tab" data-tab="hard">🔥 Hard<span class="bdg" id="hardBdg" style="display:none">0</span></button>
  <button class="tab" data-tab="words">📚 Words</button>
</nav>
<main>
  <section class="panel on" id="p-journey"><div class="center" id="journeyHome"></div><div id="journeySess" style="display:none"></div></section>
  <section class="panel" id="p-learn"><div class="center" id="learnHome"></div><div id="learnSess" style="display:none"></div></section>
  <section class="panel" id="p-practice"><div class="center" id="pracHome"></div><div id="pracSess" style="display:none"></div></section>
  <section class="panel" id="p-review"><div class="center" id="reviewHome"></div><div id="reviewSess" style="display:none"></div></section>
  <section class="panel" id="p-speed"><div class="center" id="speedHome"></div><div id="speedSess" style="display:none"></div></section>
  <section class="panel" id="p-hard"><div class="center" id="hardHome"></div><div id="hardSess" style="display:none"></div></section>
  <section class="panel" id="p-words">
    <div class="toolbar">
      <input id="wq" type="text" placeholder="Search… (pain, bread, merci)">
      <select id="wl"><option value="">All</option><option>A1</option><option>A2</option><option>B1</option></select>
      <select id="wd"><option value="">All districts</option></select>
      <select id="ws"><option value="">All growth</option><option value="new">🌱 New</option><option value="grow">🌿 Growing</option><option value="done">🌸 Mastered</option><option value="hard">🔥 Hard</option></select>
    </div>
    <div class="count" id="wcount"></div>
    <div id="wlist"></div>
  </section>
</main>
<footer>Light up Paris, one word at a time 🗼✨ • progress saved in this browser • tap any word to hear it 🔊<br><a href="/" style="color:var(--sun)">← back to Vocabs trainer (login + synced progress)</a></footer>

<script>
/* ================= DATA + PROGRESS (local only — no backend yet) ================= */
let WORDS=[];
const LS_S='vv-stats-v1', LS_M='vv-meta-v1';
let stats={}; try{stats=JSON.parse(localStorage.getItem(LS_S)||'{}')}catch(e){stats={}}
let meta={xp:0,day:{d:'',xp:0},streak:0,lastDay:'',best:0,badges:[],parisBoom:false};
try{Object.assign(meta,JSON.parse(localStorage.getItem(LS_M)||'{}'))}catch(e){}
if(!Array.isArray(meta.badges))meta.badges=[];
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(LS_S,JSON.stringify(stats));localStorage.setItem(LS_M,JSON.stringify(meta))}catch(e){} paintHead();};
const key=w=>w.fr+'|||'+w.en;
const st=k=>stats[k]||(stats[k]={s:0,ok:0,no:0,hard:false,last:0});
const STAGE_E=['🌱','🌱','🌿','🌿','🌳','🌸'];
const stageName=s=>s<=0?'Seed — new':s<=2?'Sprout — learning':s<=4?'Growing':'Mastered 🌸';
const RANKS=[[0,'🧳 Touriste'],[500,'🥖 Flâneur'],[1500,'🧀 Connaisseur'],[3000,'🗼 Parisien'],[6000,'🎓 Académicien'],[12000,'👑 Immortel']];
const DAILY=100, UNLOCK_AT=60, DONE_AT=80;
const DISTRICTS=[
  {id:'montmartre',e:'👋',name:'Montmartre',tag:'People & greetings',blurb:'Say bonjour like a local — greetings, friends & family.'},
  {id:'cafe',e:'☕',name:'Café de Flore',tag:'Food & drink',blurb:'Order un café crème sans stress.'},
  {id:'champs',e:'🛍️',name:'Champs-Élysées',tag:'Shopping, style & numbers',blurb:'Shop, count and charm.'},
  {id:'gare',e:'🚇',name:'Gare du Nord',tag:'Travel, city & time',blurb:'Never miss your train again.'},
  {id:'ile',e:'🏠',name:'Île Saint-Louis',tag:'Home, body & daily life',blurb:'Feel at home en français.'},
  {id:'latin',e:'💼',name:'Quartier Latin',tag:'Work, school & ideas — boss zone',blurb:'Debate, study, create. The final challenge.'},
];
const BADGES={planter:['🌱','Planter'],gardener:['💧','Gardener'],speedster:['⚡','Speedster'],
  perfect:['💯','Perfect'],streak3:['🔥','On fire'],nightowl:['🦉','Night Owl'],
  illuminator:['🗼','Illuminator'],scholar:['🎓','Scholar']};
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function award(id){if(meta.badges.includes(id))return;meta.badges.push(id);save();
  const b=BADGES[id];toast(`🏆 Badge: ${b[0]} ${b[1]}!`);}
function boom(){const colors=['#FFD833','#5B8CFF','#2FE09A','#FF7A92','#FFC98A','#A06BFF'];
  for(let i=0;i<80;i++){const c=document.createElement('div');c.className='confetti';
    c.style.left=(Math.random()*100)+'vw';c.style.background=colors[i%colors.length];
    c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=(Math.random()*.5)+'s';
    if(i%3===0)c.style.borderRadius='50%';document.body.appendChild(c);setTimeout(()=>c.remove(),3600);}}
const dWords=id=>WORDS.filter(w=>w.district===id);
const dLit=id=>{const w=dWords(id);return w.length?Math.round(w.filter(x=>st(key(x)).s>=3).length/w.length*100):0};
const dDiff=id=>{const w=dWords(id);if(!w.length)return '';
  const b1=w.filter(x=>x.level==='B1').length/w.length;
  return b1<.3?'🟢 Easy start':b1<.65?'🟡 Getting serious':'🔴 Boss zone';};
const dUnlocked=i=>i===0||dLit(DISTRICTS[i-1].id)>=UNLOCK_AT;
const parisLit=()=>WORDS.length?Math.round(WORDS.filter(w=>st(key(w)).s>=3).length/WORDS.length*100):0;
let scope=null;
const today=()=>new Date().toISOString().slice(0,10);
function addXP(n){meta.xp+=n;const t=today();
  if(meta.day.d!==t)meta.day={d:t,xp:0};meta.day.xp+=n;
  if(meta.lastDay!==t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    meta.streak=(meta.lastDay===y)?(meta.streak||0)+1:1;meta.lastDay=t;}
  if(meta.streak>=3)award('streak3');
  const h=new Date().getHours();if(h>=21||h<5)award('nightowl');
  if(meta.xp>=1000)award('scholar');
  save();}
function rank(){let r=RANKS[0];for(const x of RANKS)if(meta.xp>=x[0])r=x;return r;}
function paintHead(){$('hXp').textContent=meta.xp;$('hStreak').textContent=meta.streak||0;
  const p=Math.min(100,Math.round((meta.day.xp||0)/DAILY*100));
  $('hRing').style.setProperty('--p',p+'%');$('hRingTx').textContent=p+'%';
  const r=rank();$('rank').textContent=r[1]+' • '+meta.xp+' XP • 🗼 '+parisLit()+'% lit';
  const n=WORDS.filter(w=>st(key(w)).hard).length;
  $('hardBdg').style.display=n?'inline':'none';$('hardBdg').textContent=n;}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
function speak(fr){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(fr);u.lang='fr-FR';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');$('p-'+t.dataset.tab).classList.add('on');
  if(t.dataset.tab==='journey')renderJourney();});
$('course').onchange=()=>{scope=null;renderHomes();};

/* ================= POOLS ================= */
function pool(){const L=$('course').value;
  return WORDS.filter(w=>(!L||w.level===L)&&(!scope||w.district===scope));}
const byWeak=a=>[...a].sort((x,y)=>(st(key(x)).s-st(key(y)).s)||(st(key(x)).last-st(key(y)).last));
function pickLearn(n=5){const p=pool();
  const fresh=shuffle(byWeak(p).filter(w=>st(key(w)).s===0).slice(0,Math.max(n*4,n+20)));
  const out=[...fresh.slice(0,n)];
  if(out.length<n){const rest=shuffle(byWeak(p.filter(w=>!out.includes(w))).slice(0,60));out.push(...rest.slice(0,n-out.length));}
  return out;}
const shuffledReview=(n=10)=>shuffle(byWeak(pool()).slice(0,Math.min(n*6,300))).slice(0,n);
const pickHard=()=>pool().filter(w=>{const s=st(key(w));return s.hard||s.no>=2});
function distractors(w,field,n=3){
  const out=[];
  for(const x of [...shuffle(pool().filter(x=>x[field]&&key(x)!==key(w)&&x.level===w.level)),
                   ...shuffle(pool().filter(x=>x[field]&&key(x)!==key(w)))]){
    if(out.length>=n)break;if(!out.includes(x[field]))out.push(x[field]);}
  return out;}
function comboTag(c){return c>=3?` <span class="combo">🔥x${c}</span>`:'';}

/* ================= JOURNEY 🗼 ================= */
function eiffelSVG(pct){
  const n=26,litN=Math.round(n*pct/100);let dots='';
  for(let i=0;i<n;i++){
    const t=i/(n-1),y=292-t*232,wdt=8+t*52;
    for(const sx of [-1,1]){
      const x=100+sx*wdt,on=(i*2+(sx>0?1:0))<litN*2;
      dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="${on?'#FFD833':'#3a3f55'}" opacity="${on?1:.6}"/>`;}
    if(i%2===0){dots+=`<circle cx="100" cy="${y.toFixed(1)}" r="2" fill="${i<litN?'#FFD833':'#3a3f55'}" opacity="${i<litN?1:.6}"/>`;}}

/* ================= LEARN / REVIEW / HARD ================= */
let S=null;
const XPW={pick:10,tap:10,listen:15,spell:20};
function startSession(mode,words,el){

  if(!P||P.fb)return;const v=$('ptin').value;P.typed=v;
  const ok=norm(v)===norm(P.w.fr);P.fb={ok};
  if(ok){P.score++;P.combo++;P.best=Math.max(P.best,P.combo);P.lastXp=5+Math.min(P.combo,10);addXP(P.lastXp);}
  else{P.combo=0;P.lastXp=0;}
  renderPrac();};
window.pracNext=()=>{if(!P)return;P.i++;P.fb=null;P.typed='';renderPrac();};
function endPractice(){
  const xp=meta.xp-P.xp0,n=P.items.length,acc=n?Math.round(P.score/n*100):0;
  const pass=P.score>=Math.ceil(n*0.75);
  if(acc===100)award('perfect');
  $('pracSess').innerHTML=`<div class="center"><h1>${pass?'Practice passed! 🎉':'Not yet… 💪'}</h1>
  <div class="score"><div><b>${P.score}/${n}</b><span>score</span></div><div><b>+${xp}</b><span>XP</span></div><div><b>x${P.best}</b><span>best combo</span></div></div>
  <p class="sm" style="margin:8px 0">${pass?'Super travail !':'You need '+Math.ceil(n*0.75)+'/'+n+' to pass — practice makes perfect !'}</p>
  <button class="cta pulse" onclick="goPractice()">Practice again</button>
  <button class="cta ghost" onclick="exitPractice()">Back to menu</button></div>`;
  P=null;scope=null;renderHomes();}

/* ================= SPEED ⚡ ================= */
let SP=null;
function startSpeed(){
  const p=shuffledReview(200);if(p.length<4)return;
  SP={q:p,i:0,ok:0,combo:0,xp0:meta.xp,t:60};
  $('speedHome').style.display='none';$('speedSess').style.display='block';
  nextSpeed();
  SP.timer=setInterval(()=>{if(!SP)return;SP.t--;const n=$('speedSess').querySelector('.speednum');if(n)n.textContent=SP.t+'s';
    if(SP.t<=0){clearInterval(SP.timer);endSpeed();}},1000);}
window.startSpeed=startSpeed;
function nextSpeed(){
  if(!SP)return;const w=SP.q[SP.i%SP.q.length];SP.i++;SP.cur=w;
  const opts=shuffle([w.en,...distractors(w,'en')].slice(0,4));
  $('speedSess').innerHTML=`<div class="center"><div class="row"><button class="circ" onclick="backSpeed()" aria-label="Back">←</button>
  <span class="sm">⚡ Speed · ✓ ${SP.ok} · +${meta.xp-SP.xp0} XP${comboTag(SP.combo)}</span></div>
  <div class="fr speednum" style="text-align:center;color:var(--sun)">${SP.t}s</div>
  <div class="card pop"><div class="fr" style="font-size:28px">${esc(w.fr)}</div></div>
  ${opts.map(o=>`<button class="opt pop" onclick="speedPick(this)">${esc(o)}</button>`).join('')}</div>`;
  [...document.querySelectorAll('#speedSess .opt')].forEach(b=>b.dataset.v=b.textContent);
  SP.ans=w.en;}
window.speedPick=el=>{
  if(!SP)return;const ok=el.dataset.v===SP.ans;
  if(ok){SP.ok++;SP.combo++;addXP(5+Math.min(SP.combo,10));
    const s=st(key(SP.cur));s.ok++;s.s=Math.min(5,s.s+1);s.last=Date.now();save();}
  else SP.combo=0;
  nextSpeed();};
window.backSpeed=()=>{if(SP)clearInterval(SP.timer);SP=null;scope=null;$('speedSess').style.display='none';renderHomes();};
function endSpeed(){
  const xp=meta.xp-SP.xp0;if(SP.ok>(meta.best||0)){meta.best=SP.ok;save();}
  if(SP.ok>=15)award('speedster');
  $('speedSess').innerHTML=`<div class="center"><h1>Time's up! ⚡</h1>
  <div class="score"><div><b>${SP.ok}</b><span>correct</span></div><div><b>+${xp}</b><span>XP</span></div><div><b>${meta.best}</b><span>best</span></div></div>
  <button class="cta pulse" onclick="startSpeed()">Go again ⚡</button>
  <button class="cta ghost" onclick="backSpeed()">Menu</button></div>`;
  SP=null;}

/* ================= HOME SCREENS ================= */
function renderHomes(){
  if(!WORDS.length)return;
  renderJourney();
  const p=pool(),L=$('course').value||'All levels';
  const fresh=p.filter(w=>st(key(w)).s===0).length,
    growing=p.filter(w=>{const s=st(key(w)).s;return s>0&&s<5}).length,
    done=p.filter(w=>st(key(w)).s>=5).length,hard=pickHard().length;
  $('learnHome').innerHTML=`<div class="hero">🌱</div><div class="hero-title">Learn new words</div>
  <div class="hero-sub">${fresh} new seeds in <b>${esc(L)}</b>${scopeTag()} • plant 5 at a time:<br>see → tap → type → listen.</div>
  <button class="cta sun pulse" onclick="goLearn()">🌱 Plant 5 words</button>
  <div class="score"><div><b>${fresh}</b><span>new 🌱</span></div><div><b>${growing}</b><span>growing 🌿</span></div><div><b>${done}</b><span>mastered 🌸</span></div></div>`;
  renderPracHome();
  $('reviewHome').innerHTML=`<div class="hero">💧</div><div class="hero-title">Water your plants</div>
  <div class="hero-sub">${growing} growing • ${done} mastered 🌸 in <b>${esc(L)}</b><br>10 mixed tests, weakest first.</div>
  <button class="cta pulse" onclick="goReview()">💧 Review 10</button>`;
  $('speedHome').innerHTML=`<div class="hero">⚡</div><div class="hero-title">Speed review</div>
  <div class="hero-sub">60 seconds, as many as you can.<br>Best so far: <b>${meta.best||0}</b></div>
  <button class="cta sun pulse" onclick="startSpeed()">⚡ Start 60s</button>`;
  $('hardHome').innerHTML=`<div class="hero">🔥</div><div class="hero-title">Difficult words</div>
  <div class="hero-sub">${hard?`You have <b>${hard}</b> tricky words. Tame them!`:'No difficult words — mistakes land here automatically.'}</div>
  ${hard?`<button class="cta pulse" onclick="goHard()">🔥 Train ${Math.min(10,hard)}</button>`:''}`;
  const wd=$('wd');
  if(!wd.options.length||wd.options.length<=1){wd.innerHTML='<option value="">All districts</option>'+DISTRICTS.map(d=>`<option value="${d.id}">${d.e} ${d.name}</option>`).join('');}
  renderWords();}
window.goLearn=()=>{const w=pickLearn(5);if(!w.length)return;startSession('learn',w,'learn');};
window.goReview=()=>{const w=shuffledReview(10);if(!w.length)return;startSession('review',w,'review');};
window.goHard=()=>{const w=shuffle(pickHard()).slice(0,10);if(!w.length)return;startSession('review',w,'hard');};

/* ================= WORDS 📚 ================= */
function renderWords(){
  const q=$('wq').value.trim().toLowerCase(),L=$('wl').value,F=$('ws').value,D=$('wd').value;
  const list=WORDS.filter(w=>{
    if(L&&w.level!==L)return false;if(D&&w.district!==D)return false;const s=st(key(w));
    if(F==='new'&&s.s!==0)return false;
    if(F==='grow'&&(s.s===0||s.s>=5))return false;
    if(F==='done'&&s.s<5)return false;
    if(F==='hard'&&!s.hard)return false;
    if(q&&!(w.fr.toLowerCase().includes(q)||w.en.toLowerCase().includes(q)))return false;
    return true;});
  $('wcount').textContent=list.length+' words'+(list.length>200?' (showing 200 — search to narrow)':'');
  $('wlist').innerHTML=list.slice(0,200).map(w=>{const s=st(key(w));
    const DN=(DISTRICTS.find(d=>d.id===w.district)||{}).e||'';
    return `<button class="opt" onclick="speak('${esc(w.fr).replace(/'/g,"\\'")}')">
  <div class="row"><b>${s.hard?'🔥':STAGE_E[s.s]} ${esc(w.fr)}</b><span class="sm">${DN} ${w.level} · 🔊</span></div>
  <div class="sm">${esc(w.en)}${w.ex?` · “${esc(w.ex)}”`:''}</div></button>`}).join('')
  ||'<p class="sm">No words match.</p>';}
['wq','wl','ws','wd'].forEach(id=>$(id).addEventListener('input',renderWords));

/* ================= LOAD ================= */
async function loadWords(){
  // Works from /, /paris (rewrite), /paris/index.html, or plain file server.
  for (const u of ['vocab.json','./vocab.json','/paris/vocab.json','/vocab-app/vocab.json']){
    try{const r=await fetch(u);if(r.ok){const d=await r.json();if(Array.isArray(d)&&d.length)return d;}}catch(e){}
  }
  throw 0;
}
function showLoadError(){
  const isFile=location.protocol==='file:';
  document.querySelector('main').innerHTML=`<div class="panel on"><div class="center"><div class="hero">⚠️</div>
  <div class="hero-title">Could not load <b>vocab.json</b></div>
  <div class="hero-sub">${isFile?'You opened index.html by double-click — browsers block data files in that mode. Pick one option below:':'The word list failed to load. Try one of these:'}</div>
  <div class="card pop" style="text-align:left"><b>Option 1 — open your word file (quickest)</b>
  <div class="sm">Click below, then select <b>vocab.json</b> from the same folder as index.html.</div>
  <input type="file" id="vfile" accept=".json,application/json" style="margin-top:10px;color:var(--ink)">
  <div class="sm" id="vfilemsg" style="margin-top:6px"></div></div>
  <div class="card pop" style="text-align:left"><b>Option 2 — serve the folder (recommended)</b>
  <div class="sm">In PowerShell, run:</div>
  <div style="margin:8px 0"><code>cd vocab-app<br>python -m http.server 8080</code></div>
  <div class="sm">then open <b>http://localhost:8080</b></div>
  <button class="cta ghost" onclick="location.reload()">Retry after starting server</button></div>
  </div></div>`;
  const inp=document.getElementById('vfile');
  if(inp)inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d)||!d.length)throw 0;
      WORDS=d;paintHead();renderHomes();
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
      document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
      document.querySelector('[data-tab="journey"]').classList.add('on');$('p-journey').classList.add('on');
    }catch(e){document.getElementById('vfilemsg').textContent='That file did not look like vocab.json — please select the vocab.json from the vocab-app folder.';}};
    rd.readAsText(f);
  };
}
loadWords().then(d=>{
  WORDS=d;paintHead();renderHomes();
}).catch(showLoadError);
</script>
</body>
